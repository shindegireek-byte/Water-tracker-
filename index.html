<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071120">
<link rel="manifest" href="manifest.json">
<title>Daily Water Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#071120;color:#fff;font-family:"Trebuchet MS",Arial,sans-serif;display:flex;justify-content:center;align-items:center}
.card{width:94%;max-width:650px;min-height:900px;background:linear-gradient(145deg,#1a2538,#101827);border:1px solid #263249;border-radius:38px;padding:45px 36px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
h1{font-size:32px;letter-spacing:1px;margin-bottom:18px}.goal{color:#a8b6d0;font-size:20px;font-weight:bold}
.circle-area{display:flex;justify-content:center;align-items:center;margin:100px auto 80px}
.circle{width:410px;height:410px;border-radius:50%;position:relative;display:flex;justify-content:center;align-items:center;background:#101827;box-shadow:inset 0 0 0 35px #111c2e}
.circle::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#279cff var(--progress),#111c2e var(--progress));mask:radial-gradient(farthest-side,transparent calc(100% - 35px),#000 calc(100% - 34px));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 35px),#000 calc(100% - 34px))}
.inner{position:absolute;width:340px;height:340px;border-radius:50%;overflow:hidden;background:#101827;display:flex;justify-content:center;align-items:center;z-index:2}
.water{position:absolute;left:0;bottom:0;width:100%;height:0%;background:linear-gradient(180deg,#20bfff,#277cff);transition:height 1s cubic-bezier(.4,0,.2,1);z-index:1}
.water::before{content:"";position:absolute;width:200%;height:35px;top:-17px;left:-50%;background:rgba(255,255,255,.18);border-radius:50%;animation:wave 2s linear infinite}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(50%)}}
.water-text{position:relative;z-index:5;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.amount{font-size:52px;font-weight:bold}.ml{margin-top:8px;font-size:21px;color:#b5c5df}
.buttons{display:flex;gap:20px}button{flex:1;height:85px;border-radius:25px;font-size:22px;font-weight:bold;cursor:pointer;font-family:inherit;transition:.2s}
.add{border:none;color:#001326;background:linear-gradient(100deg,#2cc8ff,#2877ff);box-shadow:0 8px 25px rgba(25,145,255,.25)}
.reset{color:#fff;background:transparent;border:2px solid #303b50}button:active{transform:scale(.96)}
.info{display:flex;justify-content:space-between;margin-top:25px}.badge{border:2px solid #29364c;border-radius:25px;padding:13px 20px;color:#b6c3d8;font-size:16px;font-weight:bold}
@media(max-width:500px){.card{min-height:850px;padding:32px 22px;border-radius:30px}h1{font-size:27px}.goal{font-size:17px}.circle-area{margin:80px auto 65px}.circle{width:330px;height:330px}.inner{width:270px;height:270px}.amount{font-size:42px}.buttons{gap:12px}button{height:70px;font-size:18px}.badge{font-size:13px;padding:11px 14px}}
</style>
</head>
<body>
<div class="card">
<h1>Daily Water Tracker</h1>
<div class="goal">Goal: 3L (360°). Tap +500 ml to fill the circle.</div>
<div class="circle-area">
<div class="circle" id="circle" style="--progress:0deg">
<div class="inner"><div class="water" id="water"></div>
<div class="water-text"><div class="amount" id="amount">0.0 L</div><div class="ml" id="ml">0 / 3000 ml</div></div>
</div></div></div>
<div class="buttons"><button class="add" onclick="addWater()">+ 500 ml</button><button class="reset" onclick="resetWater()">Reset</button></div>
<div class="info"><div class="badge">Angle: <span id="angle">0</span>° / 360°</div><div class="badge">Clicks: <span id="clicks">0</span> / 6</div></div>
</div>
<script>
const goal=3000, increment=500;
let waterAmount=Number(localStorage.getItem("waterAmount")||0);
function addWater(){if(waterAmount<goal){waterAmount=Math.min(goal,waterAmount+increment);save();update()}}
function resetWater(){waterAmount=0;save();update()}
function save(){localStorage.setItem("waterAmount",waterAmount)}
function update(){
 const percentage=(waterAmount/goal)*100, angle=(waterAmount/goal)*360;
 document.getElementById("amount").textContent=(waterAmount/1000).toFixed(1)+" L";
 document.getElementById("ml").textContent=waterAmount+" / 3000 ml";
 document.getElementById("water").style.height=percentage+"%";
 document.getElementById("circle").style.setProperty("--progress",angle+"deg");
 document.getElementById("angle").textContent=Math.round(angle);
 document.getElementById("clicks").textContent=waterAmount/increment;
}
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
update();
</script>
</body>
</html>
